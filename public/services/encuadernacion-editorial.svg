<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <filter id="shadowBook" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="bookCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadowBook)">
    <!-- Main Standing Softcover Book Perspective -->
    <!-- Front Cover -->
    <path d="M160 140 L340 180 V340 L160 300 Z" fill="url(#bookCoverGrad)"/>
    
    <!-- Spine (Hotmelt / Perfect Bound) -->
    <path d="M130 155 L160 140 V300 L130 315 Z" fill="#065f46"/>
    
    <!-- Book Pages Block (Top Edge) -->
    <path d="M160 140 L310 100 L340 180 L160 140 Z" fill="#f8fafc"/>
    <path d="M130 155 L280 115 L310 100 L130 155 Z" fill="#e2e8f0"/>

    <!-- Cover Accent / Spine Foil Lines -->
    <line x1="145" y1="170" x2="145" y2="285" stroke="#34d399" stroke-width="2"/>
    <rect x="190" y="190" width="110" height="12" rx="6" fill="#ecfdf5"/>
    <rect x="190" y="212" width="75" height="8" rx="4" fill="#a7f3d0"/>

    <!-- Second Book / Magazine fanned open behind -->
    <g transform="translate(60, -30)">
      <path d="M180 140 L340 170 V320 L180 290 Z" fill="#059669" opacity="0.8"/>
      <path d="M150 150 L180 140 V290 L150 300 Z" fill="#047857" opacity="0.8"/>
      <path d="M180 140 L320 110 L340 170 L180 140 Z" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>
</svg>
