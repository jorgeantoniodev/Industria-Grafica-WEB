<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <filter id="shadowOffset" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Offset Cylinder / Machine Mockup -->
  <g filter="url(#shadowOffset)">
    <!-- Base Paper Sheet -->
    <rect x="60" y="80" width="380" height="280" rx="16" fill="#ffffff"/>
    
    <!-- Printed Poster Graphic on Sheet -->
    <rect x="80" y="100" width="220" height="240" rx="12" fill="#1e1b4b"/>
    <circle cx="190" cy="180" r="50" fill="#6366f1" opacity="0.8"/>
    <rect x="110" y="260" width="160" height="14" rx="7" fill="#ffffff"/>
    <rect x="110" y="284" width="100" height="10" rx="5" fill="#818cf8"/>

    <!-- Right Side CMYK Process Strips -->
    <rect x="320" y="100" width="100" height="240" rx="12" fill="#f8fafc"/>
    <rect x="335" y="120" width="70" height="40" rx="8" fill="#00ffff"/> <!-- Cyan -->
    <rect x="335" y="170" width="70" height="40" rx="8" fill="#ff00ff"/> <!-- Magenta -->
    <rect x="335" y="220" width="70" height="40" rx="8" fill="#ffff00"/> <!-- Yellow -->
    <rect x="335" y="270" width="70" height="40" rx="8" fill="#0f172a"/> <!-- Key/Black -->

    <!-- Registration Alignment Marks (Targets) -->
    <circle cx="95" cy="115" r="10" stroke="#00ffff" stroke-width="2" fill="none"/>
    <line x1="95" y1="100" x2="95" y2="130" stroke="#00ffff" stroke-width="2"/>
    <line x1="80" y1="115" x2="110" y2="115" stroke="#00ffff" stroke-width="2"/>

    <circle cx="285" cy="115" r="10" stroke="#ff00ff" stroke-width="2" fill="none"/>
    <line x1="285" y1="100" x2="285" y2="130" stroke="#ff00ff" stroke-width="2"/>
    <line x1="270" y1="115" x2="300" y2="115" stroke="#ff00ff" stroke-width="2"/>
  </g>
</svg>
